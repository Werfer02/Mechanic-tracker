kind = "mobile"
previewPath = "/"
title = "Mechanic Tracker"
version = "1.0.0"
id = "artifacts/mechanic-tracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21092

[services.development]
run = "pnpm --filter @workspace/mechanic-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mechanic-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mechanic-tracker", "run", "serve" ]

[services.env]
PORT = "21092"
BASE_PATH = "/"
