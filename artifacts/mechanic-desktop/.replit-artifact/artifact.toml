kind = "web"
previewPath = "/mechanic-desktop/"
title = "Mechanic Desktop"
version = "1.0.0"
id = "artifacts/mechanic-desktop"
router = "path"

[[services]]
name = "web"
paths = [ "/mechanic-desktop/" ]
localPort = 20097

[services.development]
run = "pnpm --filter @workspace/mechanic-desktop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mechanic-desktop", "run", "build" ]
serve = "static"
publicDir = "artifacts/mechanic-desktop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20097"
BASE_PATH = "/mechanic-desktop/"
