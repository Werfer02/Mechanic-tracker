services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mechanic}
      POSTGRES_USER: ${POSTGRES_USER:-mechanic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mechanic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mechanic}:${POSTGRES_PASSWORD:-mechanic}@db:5432/${POSTGRES_DB:-mechanic}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    command: ["sh", "-c", "pnpm --filter @workspace/db run push && node --enable-source-maps artifacts/api-server/dist/index.mjs"]
    restart: unless-stopped

  desktop:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    depends_on:
      - api
    ports:
      - "${DESKTOP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
